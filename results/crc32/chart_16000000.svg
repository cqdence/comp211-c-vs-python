<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="454" font-family="system-ui, sans-serif" font-size="13">
<rect width="1100" height="454" fill="#ffffff"/>
<text x="260" y="28" font-size="16" font-weight="600" fill="#111827">CRC-32: should you rewrite it in C? - 16,000,000 bytes</text>
<line x1="260.0" y1="56" x2="260.0" y2="402" stroke="#e5e7eb"/>
<text x="260.0" y="418" text-anchor="middle" fill="#6b7280">1 ms</text>
<line x1="386.0" y1="56" x2="386.0" y2="402" stroke="#e5e7eb"/>
<text x="386.0" y="418" text-anchor="middle" fill="#6b7280">10 ms</text>
<line x1="512.0" y1="56" x2="512.0" y2="402" stroke="#e5e7eb"/>
<text x="512.0" y="418" text-anchor="middle" fill="#6b7280">100 ms</text>
<line x1="638.0" y1="56" x2="638.0" y2="402" stroke="#e5e7eb"/>
<text x="638.0" y="418" text-anchor="middle" fill="#6b7280">1 s</text>
<line x1="764.0" y1="56" x2="764.0" y2="402" stroke="#e5e7eb"/>
<text x="764.0" y="418" text-anchor="middle" fill="#6b7280">10 s</text>
<line x1="890.0" y1="56" x2="890.0" y2="402" stroke="#e5e7eb"/>
<text x="890.0" y="418" text-anchor="middle" fill="#6b7280">100 s</text>
<text x="250" y="80.8" text-anchor="end" fill="#111827">Python calling zlib once</text>
<rect x="260" y="64" width="57.7" height="24" rx="3" fill="#7c3aed"/>
<text x="323.7" y="80.8" fill="#111827">2.87 ms  ·  2,951x faster</text>
<text x="250" y="112.8" text-anchor="end" fill="#111827">C calling zlib</text>
<rect x="260" y="96" width="57.9" height="24" rx="3" fill="#2563eb"/>
<text x="323.9" y="112.8" fill="#111827">2.88 ms  ·  2,940x faster</text>
<text x="250" y="144.8" text-anchor="end" fill="#111827">C -O2, slicing-by-8</text>
<rect x="260" y="128" width="92.8" height="24" rx="3" fill="#2563eb"/>
<text x="358.8" y="144.8" fill="#111827">5.45 ms  ·  1,555x faster</text>
<text x="250" y="176.8" text-anchor="end" fill="#111827">Python calling my C table</text>
<rect x="260" y="160" width="179.5" height="24" rx="3" fill="#059669"/>
<text x="445.5" y="176.8" fill="#111827">26.6 ms  ·  319x faster</text>
<text x="250" y="208.8" text-anchor="end" fill="#111827">C -O2, table</text>
<rect x="260" y="192" width="179.5" height="24" rx="3" fill="#2563eb"/>
<text x="445.5" y="208.8" fill="#111827">26.6 ms  ·  319x faster</text>
<text x="250" y="240.8" text-anchor="end" fill="#111827">C -O2, bitwise</text>
<rect x="260" y="224" width="257.0" height="24" rx="3" fill="#2563eb"/>
<text x="523.0" y="240.8" fill="#111827">110 ms  ·  77x faster</text>
<text x="250" y="272.8" text-anchor="end" fill="#111827">C -O0, bitwise</text>
<rect x="260" y="256" width="310.8" height="24" rx="3" fill="#2563eb"/>
<text x="576.8" y="272.8" fill="#111827">293 ms  ·  29x faster</text>
<text x="250" y="304.8" text-anchor="end" fill="#111827">Python, table</text>
<rect x="260" y="288" width="391.8" height="24" rx="3" fill="#d97706"/>
<text x="657.8" y="304.8" fill="#111827">1.29 s  ·  6.6x faster</text>
<text x="250" y="336.8" text-anchor="end" fill="#111827">Python calling zlib per byte</text>
<rect x="260" y="320" width="397.7" height="24" rx="3" fill="#7c3aed"/>
<text x="663.7" y="336.8" fill="#111827">1.43 s  ·  5.9x faster</text>
<text x="250" y="368.8" text-anchor="end" fill="#111827">Python, bitwise</text>
<rect x="260" y="352" width="494.9" height="24" rx="3" fill="#d97706"/>
<text x="760.9" y="368.8" fill="#111827">8.48 s</text>
<text x="575.0" y="442" text-anchor="middle" fill="#374151">time for 16,000,000 bytes (log scale), shorter is faster; &quot;x faster&quot; compares with Python, bitwise</text>
<rect x="260" y="40" width="12" height="12" fill="#7c3aed"/>
<text x="277" y="51" fill="#374151">Python + C library</text>
<rect x="434" y="40" width="12" height="12" fill="#2563eb"/>
<text x="451" y="51" fill="#374151">C</text>
<rect x="472" y="40" width="12" height="12" fill="#059669"/>
<text x="489" y="51" fill="#374151">Python + my C</text>
<rect x="606" y="40" width="12" height="12" fill="#d97706"/>
<text x="623" y="51" fill="#374151">Python</text>
</svg>